version: "3.9"

services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}

  api:
    build:
      context: .
      dockerfile: src/weather/weather_fetcher/Dockerfile
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      RABBITMQ_HOST: rabbitmq

  saver:
    build:
      context: .
      dockerfile: src/weather/weather_saver/Dockerfile
    command: python -m src.weather.weather_saver.consumer
    env_file:
      - .env
    environment:
      RABBITMQ_HOST: rabbitmq
